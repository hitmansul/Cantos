name: Connect live UI to central engine

on:
  push:
    paths:
      - '.github/workflows/apply-central-live-engine.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Route live UI through central engine
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/LiveCornerStats.tsx')
          text = path.read_text()
          old = "fetch('/api/365scores/live', { cache: 'no-store' })"
          new = "fetch('/api/live/central?refresh=1', { cache: 'no-store' })"
          if old not in text:
              raise SystemExit('live endpoint marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/LiveCornerStats.tsx
          git commit -m "feat: consume central live monitoring engine"
          git push origin main
