name: Apply live history decision filters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-live-history-filters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add decision filters and counters
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/app/live-history/page.tsx')
          text = path.read_text()

          text = text.replace(
            "type Confidence = 'Alta' | 'Média' | 'Baixa' | 'Insuficiente';",
            "type Confidence = 'Alta' | 'Média' | 'Baixa' | 'Insuficiente';\ntype DecisionFilter = 'TODOS' | Decision;"
          )

          text = text.replace(
            "  const [sortByScore, setSortByScore] = useState(false);",
            "  const [sortByScore, setSortByScore] = useState(false);\n  const [decisionFilter, setDecisionFilter] = useState<DecisionFilter>('TODOS');"
          )

          old = """  const orderedMatches = useMemo(() => sortByScore ? [...matches].sort((a, b) => {
    const aIntelligence = calculateIntelligence(a);
    const bIntelligence = calculateIntelligence(b);
    if (aIntelligence.ready !== bIntelligence.ready) return aIntelligence.ready ? -1 : 1;
    return bIntelligence.score - aIntelligence.score;
  }) : matches, [matches, sortByScore]);"""

          new = """  const intelligenceById = useMemo(() => new Map(
    matches.map(match => [match.id, calculateIntelligence(match)] as const)
  ), [matches]);

  const decisionCounts = useMemo(() => {
    const counts: Record<DecisionFilter, number> = {
      TODOS: matches.length,
      OPORTUNIDADE: 0,
      ACOMPANHAR: 0,
      EVITAR: 0,
      COLETANDO: 0,
    };
    for (const intelligence of intelligenceById.values()) counts[intelligence.decision] += 1;
    return counts;
  }, [matches.length, intelligenceById]);

  const orderedMatches = useMemo(() => {
    const filtered = decisionFilter === 'TODOS'
      ? matches
      : matches.filter(match => intelligenceById.get(match.id)?.decision === decisionFilter);

    if (!sortByScore) return filtered;
    return [...filtered].sort((a, b) => {
      const aIntelligence = intelligenceById.get(a.id) ?? calculateIntelligence(a);
      const bIntelligence = intelligenceById.get(b.id) ?? calculateIntelligence(b);
      if (aIntelligence.ready !== bIntelligence.ready) return aIntelligence.ready ? -1 : 1;
      return bIntelligence.score - aIntelligence.score;
    });
  }, [matches, sortByScore, decisionFilter, intelligenceById]);"""

          if old not in text:
            raise SystemExit('orderedMatches block not found')
          text = text.replace(old, new)

          old_header = """        <div className=\"mb-3 flex items-center justify-between gap-2 px-2\"><div><span className=\"font-bold\">Jogos monitorados</span><span className=\"ml-2 text-xs text-muted-foreground\">{matches.length} ao vivo</span></div><button onClick={() => setSortByScore(value => !value)} className={`rounded-lg border px-2 py-1 text-xs font-semibold ${sortByScore ? 'border-emerald-500/40 bg-emerald-500/15 text-emerald-300' : 'border-border text-muted-foreground'}`}>Ordenar IA</button></div>"""

          new_header = """        <div className=\"mb-3 space-y-3 px-2\">
          <div className=\"flex items-center justify-between gap-2\"><div><span className=\"font-bold\">Jogos monitorados</span><span className=\"ml-2 text-xs text-muted-foreground\">{matches.length} ao vivo</span></div><button onClick={() => setSortByScore(value => !value)} className={`rounded-lg border px-2 py-1 text-xs font-semibold ${sortByScore ? 'border-emerald-500/40 bg-emerald-500/15 text-emerald-300' : 'border-border text-muted-foreground'}`}>{sortByScore ? 'Maior força primeiro' : 'Ordenar por força'}</button></div>
          <div className=\"flex gap-2 overflow-x-auto pb-1\" aria-label=\"Filtrar jogos por recomendação\">
            {(['TODOS', 'OPORTUNIDADE', 'ACOMPANHAR', 'EVITAR', 'COLETANDO'] as DecisionFilter[]).map(filter => (
              <button
                key={filter}
                type=\"button\"
                onClick={() => setDecisionFilter(filter)}
                className={`shrink-0 rounded-lg border px-2.5 py-1.5 text-[11px] font-bold ${decisionFilter === filter ? (filter === 'TODOS' ? 'border-primary bg-primary text-primary-foreground' : decisionClass(filter)) : 'border-border text-muted-foreground'}`}
              >
                {filter === 'TODOS' ? 'Todos' : filter.charAt(0) + filter.slice(1).toLowerCase()} · {decisionCounts[filter]}
              </button>
            ))}
          </div>
        </div>"""

          if old_header not in text:
            raise SystemExit('list header not found')
          text = text.replace(old_header, new_header)

          text = text.replace(
            "          const intelligence = calculateIntelligence(match);",
            "          const intelligence = intelligenceById.get(match.id) ?? calculateIntelligence(match);"
          )

          empty_old = "{matches.length === 0 && !initialLoading && <p className=\"rounded-xl border border-dashed border-border p-4 text-sm text-muted-foreground\">Nenhuma partida disponível neste momento.</p>}"
          empty_new = "{matches.length === 0 && !initialLoading && <p className=\"rounded-xl border border-dashed border-border p-4 text-sm text-muted-foreground\">Nenhuma partida disponível neste momento.</p>}\n        {matches.length > 0 && orderedMatches.length === 0 && <p className=\"rounded-xl border border-dashed border-border p-4 text-sm text-muted-foreground\">Nenhum jogo está nesta classificação agora.</p>}"
          if empty_old not in text:
            raise SystemExit('empty state not found')
          text = text.replace(empty_old, empty_new)

          path.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/app/live-history/page.tsx
          git commit -m 'feat: add recommendation filters to live history'
          git push
