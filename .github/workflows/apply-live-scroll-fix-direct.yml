name: Apply live scroll fix directly

on:
  push:
    paths:
      - '.github/workflows/apply-live-scroll-fix-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch selected live match scroll
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/LiveCornerStats.tsx')
          text = path.read_text(encoding='utf-8')

          old = """  const scrollToSelectedDetails = useCallback((matchId: number) => {
    window.requestAnimationFrame(() => {
      window.requestAnimationFrame(() => {
        detailRefs.current[matchId]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }, []);"""

          new = """  const scrollToSelectedDetails = useCallback((matchId: number) => {
    window.requestAnimationFrame(() => {
      window.requestAnimationFrame(() => {
        const selectedCard = matchRefs.current[matchId];
        if (!selectedCard) return;

        // Mantém o jogo selecionado visível e os detalhes logo abaixo.
        const headerOffset = 88;
        const top = selectedCard.getBoundingClientRect().top + window.scrollY - headerOffset;
        window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      });
    });
  }, []);"""

          if new in text:
              print('Fix already applied')
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          else:
              raise SystemExit('Exact scroll function was not found')
          PY

      - name: Commit direct component fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/LiveCornerStats.tsx
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix: keep selected live match above inline details"
          git push origin main

