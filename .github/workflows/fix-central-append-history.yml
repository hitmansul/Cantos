name: Fix central appendHistory scope

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch appendHistory
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          route = Path('apps/web/src/app/api/live/central/route.ts')
          s = route.read_text()
          old = """async function appendHistory(matches: LiveMatch[]) {
            const capturedAt = new Date().toISOString();
            const snapshotsToPersist: Array<{ key: string; snapshot: Snapshot }> = [];

            for (const match of matches) {
              const key = eventKey(match);
              const history = responseHistory[key] ?? state.history[key] ?? [];
"""
          new = """async function appendHistory(matches: LiveMatch[]) {
            const capturedAt = new Date().toISOString();
            const snapshotsToPersist: Array<{ key: string; snapshot: Snapshot }> = [];

            for (const match of matches) {
              const key = eventKey(match);
              const history = state.history[key] ?? [];
"""
          if old not in s:
              raise SystemExit('appendHistory target not found')
          s = s.replace(old, new, 1)
          route.write_text(s)
          PY
      - name: Verify and commit
        shell: bash
        run: |
          grep -A8 "async function appendHistory" apps/web/src/app/api/live/central/route.ts | grep "const history = state.history\[key\] ?? \[\];"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/api/live/central/route.ts
          git rm .github/workflows/fix-central-append-history.yml
          git commit -m "fix: correct appendHistory history scope"
          git push origin main
