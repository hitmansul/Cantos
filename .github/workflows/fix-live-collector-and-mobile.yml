name: Fix Live Collector And Mobile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-collector-and-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair enrichment rotation and mobile selection
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Live enrichment: rotate larger batches instead of repeating the same 12 games.
          p = Path('apps/web/src/app/api/live/corners-fast/route.ts')
          s = p.read_text()
          s = s.replace('const MAX_ENRICHMENT = 12;\nconst CONCURRENCY = 4;', 'const MAX_ENRICHMENT = 48;\nconst CONCURRENCY = 8;')

          old = '''  const matches = Array.isArray(payload.matches) ? payload.matches : [];
  const candidates = matches
    .map((match, index) => {
      const selectedByName =
        requestedEventId > 0 &&
        normalize(match.homeTeam.name) === normalize(requestedHome) &&
        normalize(match.awayTeam.name) === normalize(requestedAway);
      return {
        match,
        index,
        eventId: selectedByName ? requestedEventId : match.sourceIds?.sofascore,
      };
    })
    .filter((item): item is { match: LiveMatch; index: number; eventId: number } => Boolean(item.eventId))
    .sort((a, b) => {
      if (requestedEventId > 0) {
        if (a.eventId === requestedEventId) return -1;
        if (b.eventId === requestedEventId) return 1;
      }
      const aHas = a.match.corners ? 1 : 0;
      const bHas = b.match.corners ? 1 : 0;
      return aHas - bHas;
    })
    .slice(0, requestedEventId > 0 ? 1 : MAX_ENRICHMENT);

  const enriched = [...matches];
  const results = await mapWithConcurrency(candidates, async (candidate) => {
    let stats = await enrichEvent(candidate.eventId);
    if (!stats.corners && !stats.liveStats?.length && candidate.match.sourceIds?.apiFootball) {
      stats = await enrichApiFootballFixture(candidate.match.sourceIds.apiFootball);
    }
    return { candidate, stats };
  });'''

          new = '''  const matches = Array.isArray(payload.matches) ? payload.matches : [];
  const pool = matches
    .map((match, index) => {
      const selectedByName =
        requestedEventId > 0 &&
        normalize(match.homeTeam.name) === normalize(requestedHome) &&
        normalize(match.awayTeam.name) === normalize(requestedAway);
      return {
        match,
        index,
        eventId: selectedByName ? requestedEventId : match.sourceIds?.sofascore,
        fixtureId: match.sourceIds?.apiFootball,
      };
    })
    .filter((item) => Boolean(item.eventId || item.fixtureId))
    .sort((a, b) => {
      if (requestedEventId > 0) {
        if (a.eventId === requestedEventId) return -1;
        if (b.eventId === requestedEventId) return 1;
      }
      const aHas = a.match.corners || a.match.liveStats?.length ? 1 : 0;
      const bHas = b.match.corners || b.match.liveStats?.length ? 1 : 0;
      return aHas - bHas;
    });

  // A different slice is processed on each five-minute collector cycle.
  const batchNumber = Math.floor(Date.now() / (5 * 60_000));
  const start = pool.length > 0 ? (batchNumber * MAX_ENRICHMENT) % pool.length : 0;
  const rotated = pool.length > 0 ? [...pool.slice(start), ...pool.slice(0, start)] : [];
  const candidates = requestedEventId > 0 ? pool.slice(0, 1) : rotated.slice(0, MAX_ENRICHMENT);

  const enriched = [...matches];
  const results = await mapWithConcurrency(candidates, async (candidate) => {
    let stats: CacheEntry = { expiresAt: Date.now() + NEGATIVE_CACHE_TTL_MS };
    if (candidate.eventId) stats = await enrichEvent(candidate.eventId);
    if (!stats.corners && !stats.liveStats?.length && candidate.fixtureId) {
      stats = await enrichApiFootballFixture(candidate.fixtureId);
    }
    return { candidate, stats };
  });'''

          if old in s:
              s = s.replace(old, new)
          elif 'const MAX_ENRICHMENT = 48;' not in s or 'const batchNumber = Math.floor(Date.now() / (5 * 60_000));' not in s:
              raise SystemExit('corners-fast target block not found and patch not already present')

          s = s.replace("enrichmentPolicy: 'fast-cached-sofascore-v1'", "enrichmentPolicy: 'rotating-sofascore-api-football-v2'")
          p.write_text(s)

          # 2) Mobile: use functional toggle so tapping the same match always closes it.
          p = Path('apps/web/src/app/live-history/page.tsx')
          s = p.read_text()
          old = '''  const selectMatch = useCallback((id: number) => {
    const opening = selectedId !== id;
    setSelectedId(opening ? id : null);
    if (!opening) return;
    window.requestAnimationFrame(() => {
      if (window.innerWidth < 1024) window.requestAnimationFrame(() => mobileDetailsRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    });
  }, [selectedId]);'''
          new = '''  const selectMatch = useCallback((id: number) => {
    setSelectedId(current => current === id ? null : id);
  }, []);

  useEffect(() => {
    if (selectedId === null || window.innerWidth >= 1024) return;
    const frame = window.requestAnimationFrame(() => {
      mobileDetailsRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    return () => window.cancelAnimationFrame(frame);
  }, [selectedId]);'''
          if old in s:
              s = s.replace(old, new)
          elif 'setSelectedId(current => current === id ? null : id);' not in s:
              raise SystemExit('mobile selection target block not found')
          p.write_text(s)
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/api/live/corners-fast/route.ts apps/web/src/app/live-history/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: rotate live collection and restore mobile match toggle"
          git push origin main
