name: Fix live history card toggle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-history-toggle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Toggle selected match on repeated click
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/app/live-history/page.tsx')
          text = path.read_text(encoding='utf-8')
          old = """  const selectMatch = useCallback((id: number) => {
    setSelectedId(id);
    window.requestAnimationFrame(() => {
      if (window.innerWidth < 1024) {
        window.requestAnimationFrame(() => mobileDetailsRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      }
    });
  }, []);"""
          new = """  const selectMatch = useCallback((id: number) => {
    setSelectedId((current) => {
      if (current === id) return null;

      window.requestAnimationFrame(() => {
        if (window.innerWidth < 1024) {
          window.requestAnimationFrame(() =>
            mobileDetailsRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' })
          );
        }
      });

      return id;
    });
  }, []);"""

          if new in text:
              print('Toggle already applied.')
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Toggle applied.')
          else:
              raise SystemExit('Expected selectMatch block was not found.')
          PY

      - name: Commit application change
        run: |
          if git diff --quiet -- apps/web/src/app/live-history/page.tsx; then
            echo "No application change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/live-history/page.tsx
          git commit -m "fix: close live history match on repeated click"
          git push origin main
