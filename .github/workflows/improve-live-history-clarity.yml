name: Improve live history clarity

on:
  push:
    paths:
      - '.github/workflows/improve-live-history-clarity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Simplify live history labels and explanations
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/src/app/live-history/page.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = {
            "? 'Pressão ofensiva elevada e ritmo recente favorável para nova ocorrência.'": "? 'O jogo está pressionando e criando ações ofensivas. Há sinais favoráveis para um novo escanteio.'",
            ": match.engineTrend.status === 'cooling'\n      ? 'O jogo perdeu intensidade nos registros recentes.'": ": match.engineTrend.status === 'cooling'\n      ? 'O ritmo caiu nos últimos registros. Neste momento, a tendência de novo escanteio enfraqueceu.'",
            ": 'Ritmo moderado; reavalie após nova mudança estatística.';": ": 'O jogo tem atividade, mas ainda não há força suficiente para indicar entrada. Continue acompanhando.';",
            "<p className=\"text-xs\">Score IA</p>": "<p className=\"text-xs\">Força da oportunidade</p>",
            "Leitura IA v2 · {intelligence.decision}": "Recomendação da IA · {intelligence.decision}",
            "<Metric label=\"Próximo escanteio\"": "<Metric label=\"Chance de novo escanteio\"",
            "<Metric label=\"Pressão ofensiva\"": "<Metric label=\"Pressão do jogo\"",
            "<Metric label=\"Velocidade\"": "<Metric label=\"Intensidade recente\"",
            "<Metric label=\"Confiança\"": "<Metric label=\"Confiabilidade da leitura\"",
            "<Metric label=\"Snapshots\" value={history.length} />": "<Metric label=\"Leituras registradas\" value={history.length} />",
            "<Metric label=\"Monitorado desde\" value={formatTime(first?.capturedAt)} />": "<Metric label=\"Acompanhamento iniciado\" value={formatTime(first?.capturedAt)} />",
            "<Metric label=\"Último registro\" value={formatTime(latest?.capturedAt)} />": "<Metric label=\"Dados mais recentes\" value={formatTime(latest?.capturedAt)} />",
            "Ritmo dos últimos 10 minutos": "O que mudou nos últimos 10 minutos",
            "<p className=\"text-xs text-muted-foreground\">Classificação</p>": "<p className=\"text-xs text-muted-foreground\">Tendência atual</p>",
            "<Metric label=\"Δ Escanteios\"": "<Metric label=\"Novos escanteios\"",
            "<Metric label=\"Δ Chutes\"": "<Metric label=\"Novas finalizações\"",
            "<Metric label=\"Δ Ataques perigosos\"": "<Metric label=\"Novos ataques perigosos\"",
            "<Metric label=\"Δ Tempo parado\"": "<Metric label=\"Tempo de jogo parado\"",
            "Linha do tempo registrada": "Evolução do jogo",
            "Chutes: {item.shots.total ?? '—'}": "Finalizações: {item.shots.total ?? '—'}",
            "Perigosos: {item.dangerousAttacks.total ?? '—'}": "Ataques perigosos: {item.dangerousAttacks.total ?? '—'}",
            "IA {intelligence.ready ? intelligence.score : '—'}": "Força {intelligence.ready ? intelligence.score : '—'}",
          }

          for old, new in replacements.items():
            if old not in text:
              print(f'AVISO: trecho não encontrado: {old[:80]}')
            text = text.replace(old, new)

          marker = "<p className=\"mt-2 text-sm opacity-90\">{intelligence.explanation}</p>"
          enhanced = marker + "\n      <p className=\"mt-3 rounded-xl border border-current/20 bg-background/25 p-3 text-xs opacity-90\"><strong>Como interpretar:</strong> O percentual estima a chance de ocorrer outro escanteio em breve. Pressão e intensidade vão de 0 a 100. Quanto maiores, mais ativo está o jogo. A recomendação não substitui a conferência da linha e da odd disponíveis.</p>"
          if marker in text and 'Como interpretar:' not in text:
            text = text.replace(marker, enhanced)

          path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/live-history/page.tsx
          git commit -m "ux: simplify live history intelligence explanations"
          git push
