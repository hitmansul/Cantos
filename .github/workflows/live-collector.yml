name: Live Collector

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: live-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger persistent live collector
        env:
          LIVE_COLLECTOR_URL: ${{ secrets.LIVE_COLLECTOR_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="${LIVE_COLLECTOR_URL:-https://cantos-web-final.vercel.app/api/cron/live-collector}"
          AUTH=()
          if [ -n "$CRON_SECRET" ]; then
            AUTH+=(--header "Authorization: Bearer $CRON_SECRET")
          fi

          TMP_BODY="$(mktemp)"
          trap 'rm -f "$TMP_BODY"' EXIT

          for attempt in 1 2 3 4 5 6; do
            HTTP_CODE=$(curl --silent --show-error --max-time 90 \
              "${AUTH[@]}" \
              --output "$TMP_BODY" \
              --write-out "%{http_code}" \
              "$URL" || echo "000")

            cat "$TMP_BODY" || true
            echo
            echo "Live Collector HTTP $HTTP_CODE (tentativa $attempt/6)"

            if [[ "$HTTP_CODE" =~ ^2 ]]; then
              exit 0
            fi

            if [[ "$HTTP_CODE" == "401" || "$HTTP_CODE" == "403" ]]; then
              echo "Erro permanente de autorização; verifique CRON_SECRET."
              exit 22
            fi

            if [[ "$HTTP_CODE" == "402" ]]; then
              echo "Quota de transferência indisponível neste ciclo; não haverá novas tentativas até a próxima execução agendada."
              exit 0
            fi

            if [[ "$HTTP_CODE" == "429" ]]; then
              echo "Limite de requisições atingido neste ciclo; aguardando a próxima execução agendada em vez de insistir."
              exit 0
            fi

            if [ "$attempt" -lt 6 ]; then
              sleep 20
            fi
          done

          echo "::warning::O endpoint do coletor permaneceu indisponível após 6 tentativas. Esta execução será encerrada sem falhar para evitar alertas por indisponibilidade transitória; o próximo ciclo tentará novamente automaticamente."
          exit 0
