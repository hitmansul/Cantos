name: Apply MVP1 central summary optimization

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch central summary mode
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          route = Path('apps/web/src/app/api/live/central/route.ts')
          s = route.read_text()

          old = "const COMPACT_HISTORY_LIMIT = 12;\nconst HISTORY_WINDOW_HOURS = 3;"
          new = "const COMPACT_HISTORY_LIMIT = 12;\nconst SUMMARY_HISTORY_LIMIT = 3;\nconst HISTORY_WINDOW_HOURS = 3;"
          if old not in s:
              raise SystemExit('history constants target not found')
          s = s.replace(old, new, 1)

          old = """  let responseHistory = state.history;
  if (includeHistory && historyMode !== 'compact') {
    try {
      responseHistory = await loadHistoryFromDatabase(HISTORY_LIMIT, requestedMatchId ?? undefined);
    } catch {
      responseHistory = state.history;
    }
  }
"""
          new = """  let responseHistory = state.history;
  if (includeHistory && historyMode === 'summary') {
    responseHistory = Object.fromEntries(
      Object.entries(state.history).map(([key, history]) => [key, history.slice(-SUMMARY_HISTORY_LIMIT)])
    );
  } else if (includeHistory && historyMode !== 'compact') {
    try {
      responseHistory = await loadHistoryFromDatabase(HISTORY_LIMIT, requestedMatchId ?? undefined);
    } catch {
      responseHistory = state.history;
    }
  }
"""
          if old not in s:
              raise SystemExit('response history target not found')
          s = s.replace(old, new, 1)

          old = """      historyLimit: HISTORY_LIMIT,
      trendWindowMinutes: TREND_WINDOW_MINUTES,
"""
          new = """      historyLimit: HISTORY_LIMIT,
      compactHistoryLimit: COMPACT_HISTORY_LIMIT,
      summaryHistoryLimit: SUMMARY_HISTORY_LIMIT,
      trendWindowMinutes: TREND_WINDOW_MINUTES,
"""
          if old not in s:
              raise SystemExit('engine metadata target not found')
          s = s.replace(old, new, 1)

          route.write_text(s)
          PY
      - name: Verify and commit
        shell: bash
        run: |
          grep -q "SUMMARY_HISTORY_LIMIT = 3" apps/web/src/app/api/live/central/route.ts
          grep -q "historyMode === 'summary'" apps/web/src/app/api/live/central/route.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/api/live/central/route.ts
          git rm .github/workflows/mvp1-central-summary.yml
          git commit -m "perf: add lightweight summary history mode"
          git push origin main
