name: Apply focused MVP1 live collector

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Focus live collection
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          route = Path('apps/web/src/app/api/live/corners-fast/route.ts')
          s = route.read_text()
          old = "const MAX_ENRICHMENT = 120;\nconst CONCURRENCY = 12;"
          new = "const MAX_ENRICHMENT = 40;\nconst CONCURRENCY = 8;"
          if old not in s: raise SystemExit('collector limits target not found')
          s = s.replace(old, new, 1)
          old = "      const aHas = a.match.corners || a.match.liveStats?.length ? 1 : 0;\n      const bHas = b.match.corners || b.match.liveStats?.length ? 1 : 0;\n      return aHas - bHas;"
          new = "      const aHas = a.match.corners || a.match.liveStats?.length ? 1 : 0;\n      const bHas = b.match.corners || b.match.liveStats?.length ? 1 : 0;\n      return bHas - aHas;"
          if old not in s: raise SystemExit('collector priority target not found')
          s = s.replace(old, new, 1)
          old = "  return NextResponse.json({\n    ...payload,\n    matches: enriched,\n    count: enriched.length,\n    lastUpdated: new Date().toISOString(),\n    cornerCoverage: {\n      total: enriched.length,\n      withCorners: enriched.filter((match) => Boolean(match.corners)).length,\n      attempted: candidates.length,\n      eligible: pool.length,\n      sofaLiveEvents: sofaLiveEvents.length,\n    },\n    enrichmentPolicy: 'all-eligible-multisource-v3',\n  });"
          new = "  const monitored = candidates.map((candidate) => enriched[candidate.index]);\n\n  return NextResponse.json({\n    ...payload,\n    matches: monitored,\n    count: monitored.length,\n    lastUpdated: new Date().toISOString(),\n    cornerCoverage: {\n      total: monitored.length,\n      withCorners: monitored.filter((match) => Boolean(match.corners)).length,\n      attempted: candidates.length,\n      eligible: pool.length,\n      sofaLiveEvents: sofaLiveEvents.length,\n    },\n    enrichmentPolicy: 'focused-live-set-v1',\n  });"
          if old not in s: raise SystemExit('collector response target not found')
          s = s.replace(old, new, 1)
          route.write_text(s)
          PY
      - name: Verify and commit
        shell: bash
        run: |
          grep -q "MAX_ENRICHMENT = 40" apps/web/src/app/api/live/corners-fast/route.ts
          grep -q "focused-live-set-v1" apps/web/src/app/api/live/corners-fast/route.ts
          grep -q "matches: monitored" apps/web/src/app/api/live/corners-fast/route.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/api/live/corners-fast/route.ts
          git rm .github/workflows/mvp1-focused-collector.yml
          git commit -m "perf: focus live collector on monitored matches"
          git push origin main
