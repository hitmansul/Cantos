name: Apply MVP1 live screen stability

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch live screen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          page = Path('apps/web/src/app/live-history/page.tsx')
          s = page.read_text()
          old = "const response = await fetch(`/api/live/central?history=compact&t=${Date.now()}${suffix}`, { cache: 'no-store', signal: controller.signal, headers: { 'Cache-Control': 'no-cache' } });"
          new = "const response = await fetch(`/api/live/central?history=summary&t=${Date.now()}${suffix}`, { cache: 'no-store', signal: controller.signal, headers: { 'Cache-Control': 'no-cache' } });"
          if old not in s: raise SystemExit('summary fetch target not found')
          s = s.replace(old, new, 1)
          old = "      const next = dedupeMatches(normalized);\n      setMatches(next);\n      setLastUpdated(typeof data.lastUpdated === 'string' ? data.lastUpdated : new Date().toISOString());\n      setSelectedSnapshot(current => {\n        if (!selectedKey) return current;\n        return next.find(match => matchKey(match) === selectedKey) ?? current;\n      });"
          new = "      const next = dedupeMatches(normalized);\n      let selectedDetail: LiveMatch | null = null;\n      if (selectedKey) {\n        const selectedMatch = next.find(match => matchKey(match) === selectedKey);\n        if (selectedMatch) {\n          try {\n            const detailResponse = await fetch(`/api/live/central?history=compact&matchId=${selectedMatch.id}&t=${Date.now()}`, { cache: 'no-store', signal: controller.signal, headers: { 'Cache-Control': 'no-cache' } });\n            if (detailResponse.ok) {\n              const detailData = await detailResponse.json() as Record<string, unknown>;\n              const detailRaw = Array.isArray(detailData.matches) ? detailData.matches[0] : null;\n              const detail = normalizeMatch(detailRaw);\n              if (detail && matchKey(detail) === selectedKey) selectedDetail = detail;\n            }\n          } catch (detailReason) {\n            if (detailReason instanceof DOMException && detailReason.name === 'AbortError') throw detailReason;\n          }\n        }\n      }\n      setMatches(next);\n      setLastUpdated(typeof data.lastUpdated === 'string' ? data.lastUpdated : new Date().toISOString());\n      setSelectedSnapshot(current => {\n        if (!selectedKey) return current;\n        return selectedDetail ?? next.find(match => matchKey(match) === selectedKey) ?? current;\n      });"
          if old not in s: raise SystemExit('selected detail target not found')
          s = s.replace(old, new, 1)
          old = "  const selected = useMemo(() => {\n    if (!selectedKey) return null;\n    return matches.find(match => matchKey(match) === selectedKey) ?? selectedSnapshot;\n  }, [matches, selectedKey, selectedSnapshot]);"
          new = "  const selected = useMemo(() => {\n    if (!selectedKey) return null;\n    if (selectedSnapshot && matchKey(selectedSnapshot) === selectedKey) return selectedSnapshot;\n    return matches.find(match => matchKey(match) === selectedKey) ?? null;\n  }, [matches, selectedKey, selectedSnapshot]);"
          if old not in s: raise SystemExit('selected memo target not found')
          s = s.replace(old, new, 1)
          old = "</button>{isSelected && selected && <div className=\"lg:hidden\"><MatchDetails match={selected} lastUpdated={lastUpdated} /></div>}</div>;"
          new = "</button></div>;"
          if old not in s: raise SystemExit('inline mobile detail target not found')
          s = s.replace(old, new, 1)
          anchor = "        {matches.length === 0 && !initialLoading && <p className=\"rounded-xl border border-dashed border-border p-4 text-sm text-muted-foreground\">Nenhuma partida disponível neste momento.</p>}"
          insertion = "        {selected && <div className=\"lg:hidden rounded-2xl border border-emerald-500/30 bg-background/70 p-2\"><div className=\"mb-2 flex justify-end\"><button type=\"button\" onClick={() => selectMatch(selected)} className=\"inline-flex items-center gap-1 rounded-lg border border-border px-3 py-2 text-xs font-semibold text-muted-foreground\"><X className=\"h-4 w-4\" />Fechar jogo</button></div><MatchDetails match={selected} lastUpdated={lastUpdated} /></div>}\n\n" + anchor
          if anchor not in s: raise SystemExit('mobile detail insertion target not found')
          s = s.replace(anchor, insertion, 1)
          page.write_text(s)
          PY
      - name: Verify and commit
        shell: bash
        run: |
          grep -q "history=summary" apps/web/src/app/live-history/page.tsx
          grep -q "history=compact&matchId" apps/web/src/app/live-history/page.tsx
          grep -q "Fechar jogo" apps/web/src/app/live-history/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/live-history/page.tsx
          git rm .github/workflows/mvp1-live-screen.yml
          git commit -m "feat: stabilize live match tracking for MVP1"
          git push origin main
