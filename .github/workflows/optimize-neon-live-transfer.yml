name: Optimize Neon live transfer

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch live engine
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          route = Path('apps/web/src/app/api/live/central/route.ts')
          s = route.read_text()
          s = s.replace(
              "const HISTORY_LIMIT = 360;\nconst MAX_STALE_MS = 35_000;\nconst HYDRATE_MAX_AGE_MS = 15_000;\nconst ACTIVE_MATCH_MAX_AGE_MINUTES = 15;\nconst TREND_WINDOW_MINUTES = 10;",
              "const HISTORY_LIMIT = 120;\nconst COMPACT_HISTORY_LIMIT = 12;\nconst HISTORY_WINDOW_HOURS = 3;\nconst MAX_STALE_MS = 35_000;\nconst HYDRATE_MAX_AGE_MS = 60_000;\nconst ACTIVE_MATCH_MAX_AGE_MINUTES = 15;\nconst TREND_WINDOW_MINUTES = 10;"
          )

          marker = "async function hydrateFromDatabase(force = false) {"
          if 'async function loadHistoryFromDatabase' not in s:
              helper = """async function loadHistoryFromDatabase(limit: number, requestedMatchId?: string) {
            const matchId = requestedMatchId ?? '';
            const snapshotRows = await sql`
              SELECT event_key, snapshot_data
              FROM (
                SELECT snapshots.event_key, snapshots.snapshot_data, snapshots.captured_at,
                  ROW_NUMBER() OVER (PARTITION BY snapshots.event_key ORDER BY snapshots.captured_at DESC) AS row_number
                FROM live_engine_snapshots snapshots
                INNER JOIN live_engine_matches matches ON matches.event_key = snapshots.event_key
                WHERE matches.updated_at > NOW() - (${ACTIVE_MATCH_MAX_AGE_MINUTES} * INTERVAL '1 minute')
                  AND snapshots.captured_at > NOW() - (${HISTORY_WINDOW_HOURS} * INTERVAL '1 hour')
                  AND (${matchId} = '' OR matches.match_data->>'id' = ${matchId})
              ) recent
              WHERE row_number <= ${limit}
              ORDER BY event_key, captured_at ASC
            ` as SnapshotRow[];
            const history: Record<string, Snapshot[]> = {};
            for (const row of snapshotRows) {
              const snapshot = parseJson(row.snapshot_data);
              (history[row.event_key] ??= []).push(snapshot);
            }
            return history;
          }

          """
              s = s.replace(marker, helper + marker)

          hydrate_pos = s.index('async function hydrateFromDatabase')
          start = s.index("  const snapshotRows = await sql`", hydrate_pos)
          end = s.index("  state.matches = matchRows.map((row) => parseJson(row.match_data));", start)
          s = s[:start] + "  const history = await loadHistoryFromDatabase(COMPACT_HISTORY_LIMIT);\n\n" + s[end:]
          s = s.replace("    await hydrateFromDatabase(true);", "    await hydrateFromDatabase();")
          s = s.replace(
              "  const includeHistory = request.nextUrl.searchParams.get('history') !== '0';\n  const requestedMatchId = request.nextUrl.searchParams.get('matchId');",
              "  const historyMode = request.nextUrl.searchParams.get('history') ?? '1';\n  const includeHistory = historyMode !== '0';\n  const requestedMatchId = request.nextUrl.searchParams.get('matchId');"
          )
          anchor = "  const sourceMatches = requestedMatchId\n    ? state.matches.filter((match) => String(match.id) === requestedMatchId)\n    : state.matches;\n\n  const matches = sourceMatches.map((match) => {"
          replacement = "  const sourceMatches = requestedMatchId\n    ? state.matches.filter((match) => String(match.id) === requestedMatchId)\n    : state.matches;\n\n  let responseHistory = state.history;\n  if (includeHistory && historyMode !== 'compact') {\n    try {\n      responseHistory = await loadHistoryFromDatabase(HISTORY_LIMIT, requestedMatchId ?? undefined);\n    } catch {\n      responseHistory = state.history;\n    }\n  }\n\n  const matches = sourceMatches.map((match) => {"
          s = s.replace(anchor, replacement)
          s = s.replace("    const history = state.history[key] ?? [];", "    const history = responseHistory[key] ?? state.history[key] ?? [];")
          s = s.replace("      mode: 'central-persistent-neon-active-live-set',", "      mode: 'central-persistent-neon-compact-live-set',")
          route.write_text(s)

          page = Path('apps/web/src/app/live-history/page.tsx')
          p = page.read_text()
          p = p.replace('/api/live/central?t=${Date.now()}${suffix}', '/api/live/central?history=compact&t=${Date.now()}${suffix}')
          page.write_text(p)

          if 'COMPACT_HISTORY_LIMIT = 12' not in route.read_text(): raise SystemExit('route patch missing')
          if 'history=compact' not in page.read_text(): raise SystemExit('page compact mode missing')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/api/live/central/route.ts apps/web/src/app/live-history/page.tsx
          git rm .github/workflows/optimize-neon-live-transfer.yml
          git commit -m "perf: reduce Neon live transfer"
          git push origin main
