name: Patch live inline details v2

on:
  push:
    paths:
      - '.github/workflows/patch-live-inline-details-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply targeted UX correction
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('apps/web/src/components/LiveCornerStats.tsx')
          text = component.read_text()

          old_states = '''  const [loadingMatchId, setLoadingMatchId] = useState<number | null>(null);
  const matchRefs = useRef<Record<number, HTMLDivElement | null>>({});'''
          new_states = '''  const [loadingMatchId, setLoadingMatchId] = useState<number | null>(null);
  const [statsStatusByMatch, setStatsStatusByMatch] = useState<Record<number, 'loading' | 'loaded' | 'unavailable'>>({});
  const matchRefs = useRef<Record<number, HTMLDivElement | null>>({});
  const detailRefs = useRef<Record<number, HTMLDivElement | null>>({});'''
          if old_states not in text:
              raise SystemExit('state block not found')
          text = text.replace(old_states, new_states)

          start = text.index('  const selectMatch = useCallback(')
          end = text.index('\n\n  const visibleMatches =', start)
          new_select = '''  const selectMatch = useCallback(
    async (match: LiveMatch) => {
      if (selectedMatchId === match.id) {
        setSelectedMatchId(null);
        return;
      }

      setSelectedMatchId(match.id);

      const needsStats = !match.corners;
      if (needsStats) {
        setLoadingMatchId(match.id);
        setStatsStatusByMatch((current) => ({ ...current, [match.id]: 'loading' }));
      }

      window.setTimeout(() => {
        detailRefs.current[match.id]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 180);

      if (!needsStats) return;

      const sofaEventId = match.sourceIds?.sofascore;
      try {
        const params = new URLSearchParams();
        if (sofaEventId) params.set('eventId', String(sofaEventId));
        params.set('matchId', String(match.id));

        const response = await fetch(`/api/live/corners-fast?${params.toString()}`, {
          cache: 'no-store',
        });
        const data = (await response.json()) as { matches?: LiveMatch[] };
        if (!response.ok) {
          setStatsStatusByMatch((current) => ({ ...current, [match.id]: 'unavailable' }));
          return;
        }

        const refreshed = data.matches?.find(
          (item) =>
            item.id === match.id ||
            (sofaEventId && item.sourceIds?.sofascore === sofaEventId)
        );

        if (refreshed) {
          setMatches((current) =>
            current.map((item) =>
              item.id === match.id ? mergeLiveMatch(item, refreshed) : item
            )
          );
        }

        const receivedStats = Boolean(refreshed?.corners || refreshed?.liveStats?.length);
        setStatsStatusByMatch((current) => ({
          ...current,
          [match.id]: receivedStats ? 'loaded' : 'unavailable',
        }));
      } catch {
        setStatsStatusByMatch((current) => ({ ...current, [match.id]: 'unavailable' }));
      } finally {
        setLoadingMatchId((current) => (current === match.id ? null : current));
        window.setTimeout(() => {
          detailRefs.current[match.id]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 120);
      }
    },
    [selectedMatchId]
  );'''
          text = text[:start] + new_select + text[end:]

          old_details = '''                      {selected && (
                        <LiveMatchDetails
                          match={match}
                          competition={competition}
                          onClose={() => setSelectedMatchId(null)}
                        />
                      )}'''
          new_details = '''                      {selected && (
                        <div
                          ref={(node) => {
                            detailRefs.current[match.id] = node;
                          }}
                          className="scroll-mt-20 space-y-3"
                        >
                          {loadingMatchId === match.id && (
                            <div className="flex items-center justify-center gap-2 rounded-xl border border-amber-500/30 bg-amber-500/10 p-4 text-sm font-medium text-amber-300">
                              <RefreshCw className="h-4 w-4 animate-spin" />
                              Buscando escanteios e estatísticas deste jogo...
                            </div>
                          )}
                          {statsStatusByMatch[match.id] === 'unavailable' && !match.corners && !match.liveStats?.length && (
                            <div className="rounded-xl border border-border bg-card/80 p-4 text-sm text-muted-foreground">
                              A consulta foi concluída, mas a fonte ainda não disponibilizou escanteios ou estatísticas detalhadas para esta partida.
                            </div>
                          )}
                          <LiveMatchDetails
                            match={match}
                            competition={competition}
                            onClose={() => setSelectedMatchId(null)}
                          />
                        </div>
                      )}'''
          if old_details not in text:
              raise SystemExit('details block not found')
          text = text.replace(old_details, new_details)

          component.write_text(text)
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/LiveCornerStats.tsx
          git commit -m "fix: show live stats loading and keep details beside selected match"
          git push origin main