name: Force live loading render

on:
  push:
    paths:
      - '.github/workflows/patch-live-loading-force-paint.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch live loading behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/LiveCornerStats.tsx')
          text = path.read_text()

          marker = "  const selectMatch = useCallback(\n"
          helper = """  const waitForNextPaint = useCallback(\n    () =>\n      new Promise<void>((resolve) => {\n        window.requestAnimationFrame(() => {\n          window.requestAnimationFrame(() => resolve());\n        });\n      }),\n    []\n  );\n\n"""
          if helper not in text:
              if marker not in text:
                  raise SystemExit('selectMatch marker not found')
              text = text.replace(marker, helper + marker, 1)

          old = """      setSelectedMatchId(match.id);\n\n      if (match.corners) {\n        setLoadingMatchId(null);\n        return;\n      }\n\n      const startedAt = Date.now();\n      setLoadingMatchId(match.id);\n\n      try {"""
          new = """      const hasUsableCorners = Boolean(\n        match.corners &&\n          Number.isFinite(match.corners.home) &&\n          Number.isFinite(match.corners.away) &&\n          Number.isFinite(match.corners.total)\n      );\n\n      setLoadingMatchId(hasUsableCorners ? null : match.id);\n      setSelectedMatchId(match.id);\n\n      // Aguarda o navegador realmente pintar o novo jogo e o indicador antes da chamada externa.\n      await waitForNextPaint();\n      scrollToSelectedDetails(match.id);\n\n      if (hasUsableCorners) return;\n\n      const startedAt = Date.now();\n\n      try {"""
          if old not in text:
              raise SystemExit('selectMatch opening block not found')
          text = text.replace(old, new, 1)

          old_dep = "    [scrollToSelectedDetails, selectedMatchId]\n  );"
          new_dep = "    [scrollToSelectedDetails, selectedMatchId, waitForNextPaint]\n  );"
          if old_dep not in text:
              raise SystemExit('dependency block not found')
          text = text.replace(old_dep, new_dep, 1)

          old_loading = """                          {loadingMatchId === match.id && !match.corners && (\n                            <div className=\"flex items-center justify-center gap-2 rounded-xl border border-amber-500/30 bg-amber-500/10 p-4 text-sm font-medium text-amber-300\">\n                              <RefreshCw className=\"h-4 w-4 animate-spin\" />\n                              Buscando escanteios e estatísticas deste jogo...\n                            </div>\n                          )}"""
          new_loading = """                          {loadingMatchId === match.id && (\n                            <div\n                              role=\"status\"\n                              aria-live=\"polite\"\n                              className=\"sticky top-20 z-20 flex items-center justify-center gap-2 rounded-xl border border-amber-400/60 bg-amber-500/20 p-4 text-sm font-bold text-amber-200 shadow-lg backdrop-blur\"\n                            >\n                              <RefreshCw className=\"h-5 w-5 animate-spin\" />\n                              Buscando escanteios e estatísticas deste jogo...\n                            </div>\n                          )}"""
          if old_loading not in text:
              raise SystemExit('details loading block not found')
          text = text.replace(old_loading, new_loading, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/LiveCornerStats.tsx
          git commit -m "fix: force selected live loading indicator to render"
          git push origin main