name: Patch live match UX

on:
  push:
    paths:
      - '.github/workflows/patch-live-match-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply targeted patch
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('apps/web/src/components/LiveCornerStats.tsx')
          text = component.read_text()

          text = text.replace(
              "import { useState, useEffect, useCallback, useMemo } from 'react';",
              "import { useState, useEffect, useCallback, useMemo, useRef } from 'react';",
          )

          text = text.replace(
              "  selected,\n  onClick,\n}: {\n  match: LiveMatch;\n  selected?: boolean;\n  onClick?: () => void;\n}) {",
              "  selected,\n  loadingStats,\n  onClick,\n}: {\n  match: LiveMatch;\n  selected?: boolean;\n  loadingStats?: boolean;\n  onClick?: () => void;\n}) {",
          )

          old_corners = '''      {match.corners && (\n        <div className=\"mt-3 pt-3 border-t border-border/50\">\n          <div className=\"flex items-center justify-center gap-4 text-sm\">\n            <div className=\"flex items-center gap-1 text-amber-400\">\n              <CornerUpRight className=\"w-4 h-4\" />\n              <span className=\"font-medium\">{match.corners.home}</span>\n            </div>\n            <span className=\"text-muted-foreground\">Escanteios</span>\n            <div className=\"flex items-center gap-1 text-amber-400\">\n              <span className=\"font-medium\">{match.corners.away}</span>\n              <CornerUpRight className=\"w-4 h-4 scale-x-[-1]\" />\n            </div>\n          </div>\n          <p className=\"text-center text-xs text-muted-foreground mt-1\">\n            Total: {match.corners.total}\n          </p>\n        </div>\n      )}'''
          new_corners = '''      {match.corners ? (\n        <div className=\"mt-3 pt-3 border-t border-border/50\">\n          <div className=\"flex items-center justify-center gap-4 text-sm\">\n            <div className=\"flex items-center gap-1 text-amber-400\">\n              <CornerUpRight className=\"w-4 h-4\" />\n              <span className=\"font-medium\">{match.corners.home}</span>\n            </div>\n            <span className=\"text-muted-foreground\">Escanteios</span>\n            <div className=\"flex items-center gap-1 text-amber-400\">\n              <span className=\"font-medium\">{match.corners.away}</span>\n              <CornerUpRight className=\"w-4 h-4 scale-x-[-1]\" />\n            </div>\n          </div>\n          <p className=\"text-center text-xs text-muted-foreground mt-1\">\n            Total: {match.corners.total}\n          </p>\n        </div>\n      ) : loadingStats ? (\n        <div className=\"mt-3 flex items-center justify-center gap-2 border-t border-border/50 pt-3 text-sm text-amber-300\">\n          <RefreshCw className=\"h-4 w-4 animate-spin\" />\n          Buscando escanteios e estatísticas deste jogo...\n        </div>\n      ) : (\n        <div className=\"mt-3 border-t border-border/50 pt-3 text-center text-xs text-muted-foreground\">\n          Toque no jogo para buscar escanteios e estatísticas detalhadas.\n        </div>\n      )}'''
          if old_corners not in text:
              raise SystemExit('corner block not found')
          text = text.replace(old_corners, new_corners)

          old_states = '''  const [selectedCompetition, setSelectedCompetition] = useState('all');\n  const [selectedMatchId, setSelectedMatchId] = useState<number | null>(null);'''
          new_states = '''  const [selectedCompetition, setSelectedCompetition] = useState('all');\n  const [selectedMatchId, setSelectedMatchId] = useState<number | null>(null);\n  const [loadingMatchId, setLoadingMatchId] = useState<number | null>(null);\n  const matchRefs = useRef<Record<number, HTMLDivElement | null>>({});'''
          if old_states not in text:
              raise SystemExit('state block not found')
          text = text.replace(old_states, new_states)

          marker = '''  useEffect(() => {\n    if (selectedMatchId !== null && !matches.some((match) => match.id === selectedMatchId)) {\n      setSelectedMatchId(null);\n    }\n  }, [matches, selectedMatchId]);\n'''
          addition = marker + '''\n  const selectMatch = useCallback(\n    async (match: LiveMatch) => {\n      if (selectedMatchId === match.id) {\n        setSelectedMatchId(null);\n        return;\n      }\n\n      setSelectedMatchId(match.id);\n      window.setTimeout(() => {\n        matchRefs.current[match.id]?.scrollIntoView({ behavior: 'smooth', block: 'start' });\n      }, 80);\n\n      const sofaEventId = match.sourceIds?.sofascore;\n      if (match.corners || !sofaEventId) return;\n\n      setLoadingMatchId(match.id);\n      try {\n        const response = await fetch(`/api/live/corners-fast?eventId=${sofaEventId}`, {\n          cache: 'no-store',\n        });\n        const data = (await response.json()) as { matches?: LiveMatch[] };\n        if (!response.ok) return;\n\n        const refreshed = data.matches?.find(\n          (item) =>\n            item.id === match.id || item.sourceIds?.sofascore === sofaEventId\n        );\n        if (refreshed) {\n          setMatches((current) =>\n            current.map((item) =>\n              item.id === match.id ? mergeLiveMatch(item, refreshed) : item\n            )\n          );\n        }\n      } finally {\n        setLoadingMatchId((current) => (current === match.id ? null : current));\n        window.setTimeout(() => {\n          matchRefs.current[match.id]?.scrollIntoView({ behavior: 'smooth', block: 'start' });\n        }, 80);\n      }\n    },\n    [selectedMatchId]\n  );\n'''
          if marker not in text:
              raise SystemExit('selection effect not found')
          text = text.replace(marker, addition)

          old_render = '''                    <div key={match.id} className=\"space-y-3\">\n                      <LiveMatchCard\n                        match={match}\n                        selected={selected}\n                        onClick={() => setSelectedMatchId((current) => (current === match.id ? null : match.id))}\n                      />'''
          new_render = '''                    <div\n                      key={match.id}\n                      ref={(node) => {\n                        matchRefs.current[match.id] = node;\n                      }}\n                      className=\"scroll-mt-24 space-y-3\"\n                    >\n                      <LiveMatchCard\n                        match={match}\n                        selected={selected}\n                        loadingStats={loadingMatchId === match.id}\n                        onClick={() => void selectMatch(match)}\n                      />'''
          if old_render not in text:
              raise SystemExit('render block not found')
          text = text.replace(old_render, new_render)
          component.write_text(text)

          route = Path('apps/web/src/app/api/live/corners-fast/route.ts')
          route_text = route.read_text()
          route_text = route_text.replace(
              'export async function GET(request: NextRequest) {\n  const rawUrl',
              "export async function GET(request: NextRequest) {\n  const requestedEventId = Number(request.nextUrl.searchParams.get('eventId') ?? '0');\n  const rawUrl",
          )
          old_sort = '''    .sort((a, b) => {\n      const aHas = a.match.corners ? 1 : 0;\n      const bHas = b.match.corners ? 1 : 0;\n      return aHas - bHas;\n    })\n    .slice(0, MAX_ENRICHMENT);'''
          new_sort = '''    .sort((a, b) => {\n      if (requestedEventId > 0) {\n        if (a.eventId === requestedEventId) return -1;\n        if (b.eventId === requestedEventId) return 1;\n      }\n      const aHas = a.match.corners ? 1 : 0;\n      const bHas = b.match.corners ? 1 : 0;\n      return aHas - bHas;\n    })\n    .slice(0, requestedEventId > 0 ? 1 : MAX_ENRICHMENT);'''
          if old_sort not in route_text:
              raise SystemExit('route sort block not found')
          route_text = route_text.replace(old_sort, new_sort)
          route.write_text(route_text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/LiveCornerStats.tsx apps/web/src/app/api/live/corners-fast/route.ts
          git commit -m "fix: load selected live match stats inline with feedback"
          git push origin main
