name: Patch live stats status and API-Football fallback

on:
  push:
    paths:
      - '.github/workflows/patch-live-stats-status-and-api-football.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('apps/web/src/components/LiveCornerStats.tsx')
          text = component.read_text()

          old_state = "  const [loadingMatchId, setLoadingMatchId] = useState<number | null>(null);\n  const matchRefs = useRef<Record<number, HTMLDivElement | null>>({});"
          new_state = "  const [loadingMatchId, setLoadingMatchId] = useState<number | null>(null);\n  const [statsStatusByMatch, setStatsStatusByMatch] = useState<Record<number, 'loading' | 'loaded' | 'unavailable'>>({});\n  const matchRefs = useRef<Record<number, HTMLDivElement | null>>({});"
          if old_state in text:
              text = text.replace(old_state, new_state)

          old_select = "      setLoadingMatchId(hasUsableCorners ? null : match.id);\n      setSelectedMatchId(match.id);"
          new_select = "      setStatsStatusByMatch((current) => ({ ...current, [match.id]: hasUsableCorners ? 'loaded' : 'loading' }));\n      setLoadingMatchId(hasUsableCorners ? null : match.id);\n      setSelectedMatchId(match.id);"
          if old_select in text:
              text = text.replace(old_select, new_select)

          old_refreshed = "          if (refreshed) {\n            setMatches((current) =>\n              current.map((item) =>\n                item.id === match.id ? mergeLiveMatch(item, refreshed) : item\n              )\n            );\n          }"
          new_refreshed = "          if (refreshed) {\n            const hasStats = Boolean(refreshed.corners || refreshed.liveStats?.length);\n            setMatches((current) =>\n              current.map((item) =>\n                item.id === match.id ? mergeLiveMatch(item, refreshed) : item\n              )\n            );\n            setStatsStatusByMatch((current) => ({\n              ...current,\n              [match.id]: hasStats ? 'loaded' : 'unavailable',\n            }));\n          } else {\n            setStatsStatusByMatch((current) => ({ ...current, [match.id]: 'unavailable' }));\n          }"
          if old_refreshed in text:
              text = text.replace(old_refreshed, new_refreshed)

          old_finally = "        window.setTimeout(() => {\n          setLoadingMatchId((current) => (current === match.id ? null : current));\n          scrollToSelectedDetails(match.id);\n        }, remaining);"
          new_finally = "        window.setTimeout(() => {\n          setLoadingMatchId((current) => (current === match.id ? null : current));\n          setStatsStatusByMatch((current) =>\n            current[match.id] === 'loading' ? { ...current, [match.id]: 'unavailable' } : current\n          );\n          scrollToSelectedDetails(match.id);\n        }, Math.max(1800, remaining));"
          if old_finally in text:
              text = text.replace(old_finally, new_finally)

          old_banner = "                          {loadingMatchId === match.id && !match.corners && (\n                            <div className=\"flex items-center justify-center gap-2 rounded-xl border border-amber-500/30 bg-amber-500/10 p-4 text-sm font-medium text-amber-300\">\n                              <RefreshCw className=\"h-4 w-4 animate-spin\" />\n                              Buscando escanteios e estatísticas deste jogo...\n                            </div>\n                          )}"
          new_banner = "                          {statsStatusByMatch[match.id] === 'loading' && !match.corners && (\n                            <div className=\"sticky top-20 z-20 flex items-center justify-center gap-2 rounded-xl border-2 border-amber-400 bg-amber-500/20 p-4 text-sm font-bold text-amber-200 shadow-lg\">\n                              <RefreshCw className=\"h-5 w-5 animate-spin\" />\n                              Buscando escanteios e estatísticas deste jogo...\n                            </div>\n                          )}\n                          {statsStatusByMatch[match.id] === 'unavailable' && !match.corners && (\n                            <div className=\"rounded-xl border border-slate-500/30 bg-slate-500/10 p-3 text-sm text-slate-300\">\n                              Consulta concluída: as fontes disponíveis ainda não forneceram escanteios ou estatísticas detalhadas para esta partida.\n                            </div>\n                          )}"
          if old_banner in text:
              text = text.replace(old_banner, new_banner)
          component.write_text(text)

          route = Path('apps/web/src/app/api/live/corners-fast/route.ts')
          r = route.read_text()
          if "apiFootballGet" not in r:
              r = r.replace("import { NextRequest, NextResponse } from 'next/server';", "import { NextRequest, NextResponse } from 'next/server';\nimport { apiFootballGet } from '@/app/api/utils/apiFootball';")

          marker = "async function enrichEvent(eventId: number): Promise<CacheEntry> {"
          helper = '''type ApiFootballTeamStats = {\n  team?: { id?: number; name?: string };\n  statistics?: Array<{ type?: string; value?: number | string | null }>;\n};\n\nasync function enrichApiFootballFixture(fixtureId: number): Promise<CacheEntry> {\n  const payload = await apiFootballGet<ApiFootballTeamStats[]>('/fixtures/statistics', {\n    params: { fixture: fixtureId },\n    cache: 'no-store',\n    timeoutMs: 5000,\n  });\n  const teams = payload?.response ?? [];\n  if (teams.length < 2) return { expiresAt: Date.now() + NEGATIVE_CACHE_TTL_MS };\n\n  const allTypes = Array.from(new Set(teams.flatMap((team) => (team.statistics ?? []).map((item) => item.type ?? '')))).filter(Boolean);\n  const rows: LiveStatRow[] = allTypes.map((type, index) => {\n    const homeValue = teams[0]?.statistics?.find((item) => item.type === type)?.value;\n    const awayValue = teams[1]?.statistics?.find((item) => item.type === type)?.value;\n    return {\n      key: `api-football:${normalize(type)}`,\n      label: type,\n      home: homeValue === null || homeValue === undefined ? '-' : String(homeValue),\n      away: awayValue === null || awayValue === undefined ? '-' : String(awayValue),\n      order: index,\n      categoryOrder: 0,\n      category: 'Estatísticas oficiais',\n      isMajor: ['corner', 'shot', 'possession', 'attack'].some((term) => normalize(type).includes(term)),\n    };\n  }).filter((row) => row.home !== '-' || row.away !== '-');\n\n  const corners = cornersFromRows(rows);\n  return {\n    expiresAt: Date.now() + (corners || rows.length ? CACHE_TTL_MS : NEGATIVE_CACHE_TTL_MS),\n    corners,\n    liveStats: rows.length ? (corners ? ensureCornerRow(rows, corners) : rows) : undefined,\n    source: corners || rows.length ? 'api-football' : undefined,\n  };\n}\n\n'''
          if "async function enrichApiFootballFixture" not in r:
              r = r.replace(marker, helper + marker)

          old_worker = "  const results = await mapWithConcurrency(candidates, async (candidate) => ({\n    candidate,\n    stats: await enrichEvent(candidate.eventId),\n  }));"
          new_worker = "  const results = await mapWithConcurrency(candidates, async (candidate) => {\n    let stats = await enrichEvent(candidate.eventId);\n    if (!stats.corners && !stats.liveStats?.length && candidate.match.sourceIds?.apiFootball) {\n      stats = await enrichApiFootballFixture(candidate.match.sourceIds.apiFootball);\n    }\n    return { candidate, stats };\n  });"
          if old_worker in r:
              r = r.replace(old_worker, new_worker)
          route.write_text(r)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/LiveCornerStats.tsx apps/web/src/app/api/live/corners-fast/route.ts
          if git diff --cached --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git commit -m "fix: persist live stats status and add API-Football fallback"
          git push origin main

# rerun 2026-08-02T21:33-03:00
