name: Patch opportunity consistency once

on:
  push:
    paths:
      - '.github/workflows/patch-opportunity-consistency-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align live opportunity signals
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/app/live-history/LiveHistoryPageBase.tsx')
          text = path.read_text(encoding='utf-8')

          old = "  const canBeOpportunity = confidence === 'Alta' || confidence === 'Média';\n  const decision: Decision = score >= 72 && canBeOpportunity ? 'OPORTUNIDADE' : score >= 46 ? 'ACOMPANHAR' : 'EVITAR';"
          new = "  const canBeOpportunity = (confidence === 'Alta' || confidence === 'Média') && nextCornerProbability >= 60;\n  const decision: Decision = score >= 72 && canBeOpportunity ? 'OPORTUNIDADE' : score >= 46 ? 'ACOMPANHAR' : 'EVITAR';"
          if old not in text:
              raise SystemExit('Opportunity decision block not found')
          text = text.replace(old, new, 1)

          old_explanation = "    : pressure >= 65\n      ? 'O jogo está pressionando e criando ações ofensivas. Há sinais favoráveis para um novo escanteio.'"
          new_explanation = "    : pressure >= 65 && nextCornerProbability >= 60\n      ? 'O jogo está pressionando e criando ações ofensivas. Há sinais favoráveis para um novo escanteio.'\n      : pressure >= 65\n        ? 'O jogo apresenta pressão, mas a probabilidade calculada ainda não atingiu o nível mínimo para indicar oportunidade. Continue acompanhando.'"
          if old_explanation not in text:
              raise SystemExit('Opportunity explanation block not found')
          text = text.replace(old_explanation, new_explanation, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-opportunity-consistency-once.yml
          git add apps/web/src/app/live-history/LiveHistoryPageBase.tsx .github/workflows/patch-opportunity-consistency-once.yml
          git commit -m "fix: align live opportunity with displayed probability"
          git push origin main
