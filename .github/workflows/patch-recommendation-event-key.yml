name: Align recommendation event key

on:
  push:
    paths:
      - '.github/workflows/patch-recommendation-event-key.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch source id key and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/app/api/live/recommendations/collect/route.ts')
          s = p.read_text()
          s = s.replace("  corners?: { home?: number; away?: number; total?: number };\n", "  corners?: { home?: number; away?: number; total?: number };\n  sourceIds?: { scores365?: number; sofascore?: number; apiFootball?: number };\n")
          s = s.replace("function eventKey(match: Match) {\n  return String(match.id);\n}", "function eventKey(match: Match) {\n  return String(match.sourceIds?.scores365 ?? match.id);\n}")
          p.write_text(s)
          PY
          rm .github/workflows/patch-recommendation-event-key.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/api/live/recommendations/collect/route.ts .github/workflows/patch-recommendation-event-key.yml
          git commit -m "fix: align recommendation events with snapshot keys"
          git push
