name: Patch stale timestamp safety once

on:
  push:
    paths:
      - '.github/workflows/patch-stale-timestamp-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require valid recent engine timestamp
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/app/live-history/page.tsx')
          text = path.read_text(encoding='utf-8')
          old = "  const stale=Number.isFinite(updatedAt)&&Date.now()-updatedAt>STALE_ENGINE_MS;"
          new = "  const stale=!Number.isFinite(updatedAt)||Date.now()-updatedAt>STALE_ENGINE_MS;"
          if old not in text:
              raise SystemExit('stale timestamp condition not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-stale-timestamp-once.yml
          git add apps/web/src/app/live-history/page.tsx .github/workflows/patch-stale-timestamp-once.yml
          git commit -m "fix: require fresh timestamp for live recommendations"
          git push origin main
