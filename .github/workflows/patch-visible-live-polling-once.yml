name: Patch visible live polling once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-visible-live-polling-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pause live polling while tab is hidden
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('apps/web/src/app/live-history/LiveHistoryPageBase.tsx')
          text = base.read_text()
          old = """  useEffect(() => {\n    void load(false);\n    const timer = window.setInterval(() => void load(false), 25_000);\n    return () => { window.clearInterval(timer); requestRef.current?.abort(); };\n  }, [load]);"""
          new = """  useEffect(() => {\n    const refreshIfVisible = () => { if (document.visibilityState === 'visible') void load(false); };\n    void load(false);\n    const timer = window.setInterval(refreshIfVisible, 25_000);\n    const onVisibilityChange = () => { if (document.visibilityState === 'visible') void load(false); };\n    document.addEventListener('visibilitychange', onVisibilityChange);\n    return () => { window.clearInterval(timer); document.removeEventListener('visibilitychange', onVisibilityChange); requestRef.current?.abort(); };\n  }, [load]);"""
          if old not in text:
              raise SystemExit('Base polling block not found')
          base.write_text(text.replace(old, new, 1))

          page = Path('apps/web/src/app/live-history/page.tsx')
          text = page.read_text()
          old = """ useEffect(()=>{let cancelled=false;const loadCatalog=async()=>{try{const response=await fetch(`/api/live/catalog?t=${Date.now()}`,{cache:'no-store'});const data=await response.json() as{matches?:CatalogMatch[];error?:string};if(!response.ok)throw new Error(data.error??'Falha ao carregar jogos ao vivo');if(cancelled)return;const matches=Array.isArray(data.matches)?data.matches:[];setCatalog(matches);setCatalogError(null);}catch(error){if(!cancelled)setCatalogError(error instanceof Error?error.message:'Falha ao carregar catálogo');}};void loadCatalog();const timer=window.setInterval(()=>void loadCatalog(),45_000);return()=>{cancelled=true;window.clearInterval(timer);};},[]);"""
          new = """ useEffect(()=>{let cancelled=false;const loadCatalog=async()=>{if(document.visibilityState!=='visible')return;try{const response=await fetch(`/api/live/catalog?t=${Date.now()}`,{cache:'no-store'});const data=await response.json() as{matches?:CatalogMatch[];error?:string};if(!response.ok)throw new Error(data.error??'Falha ao carregar jogos ao vivo');if(cancelled)return;const matches=Array.isArray(data.matches)?data.matches:[];setCatalog(matches);setCatalogError(null);}catch(error){if(!cancelled)setCatalogError(error instanceof Error?error.message:'Falha ao carregar catálogo');}};void loadCatalog();const timer=window.setInterval(()=>void loadCatalog(),45_000);const onVisibilityChange=()=>{if(document.visibilityState==='visible')void loadCatalog();};document.addEventListener('visibilitychange',onVisibilityChange);return()=>{cancelled=true;window.clearInterval(timer);document.removeEventListener('visibilitychange',onVisibilityChange);};},[]);"""
          if old not in text:
              raise SystemExit('Catalog polling block not found')
          page.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove this workflow
        run: |
          rm .github/workflows/patch-visible-live-polling-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/live-history/LiveHistoryPageBase.tsx apps/web/src/app/live-history/page.tsx .github/workflows/patch-visible-live-polling-once.yml
          git commit -m "perf: pause live polling while tab is hidden"
          git push origin HEAD:main
