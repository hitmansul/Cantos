name: Persist live engine history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/persist-live-engine-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch central live engine persistence
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/app/api/live/central/route.ts')
          s = p.read_text()
          if "import sql from '@/app/api/utils/sql';" not in s:
              s = s.replace("import { NextRequest, NextResponse } from 'next/server';", "import { NextRequest, NextResponse } from 'next/server';\nimport sql from '@/app/api/utils/sql';")

          marker = "const TREND_WINDOW_MINUTES = 10;"
          block = r'''

let persistenceReady = false;

async function ensurePersistence() {
  if (persistenceReady || !process.env.DATABASE_URL) return;
  await sql`
    CREATE TABLE IF NOT EXISTS live_engine_history (
      event_key TEXT NOT NULL,
      captured_at TIMESTAMPTZ NOT NULL,
      snapshot JSONB NOT NULL,
      PRIMARY KEY (event_key, captured_at)
    )
  `;
  await sql`
    CREATE INDEX IF NOT EXISTS live_engine_history_event_time_idx
    ON live_engine_history (event_key, captured_at DESC)
  `;
  persistenceReady = true;
}

async function loadPersistentHistory(keys: string[]) {
  if (!process.env.DATABASE_URL || keys.length === 0) return;
  try {
    await ensurePersistence();
    const rows = await sql`
      SELECT event_key, snapshot
      FROM live_engine_history
      WHERE event_key = ANY(${keys})
      ORDER BY captured_at ASC
    ` as Array<{ event_key: string; snapshot: Snapshot }>;
    for (const row of rows) {
      const list = state.history[row.event_key] ?? [];
      if (!list.some((item) => item.capturedAt === row.snapshot.capturedAt)) {
        state.history[row.event_key] = [...list, row.snapshot].slice(-HISTORY_LIMIT);
      }
    }
  } catch (error) {
    console.warn('[live-engine] persistent history load failed:', error);
  }
}

async function persistSnapshots(entries: Array<{ key: string; snapshot: Snapshot }>) {
  if (!process.env.DATABASE_URL || entries.length === 0) return;
  try {
    await ensurePersistence();
    for (const entry of entries) {
      await sql`
        INSERT INTO live_engine_history (event_key, captured_at, snapshot)
        VALUES (${entry.key}, ${entry.snapshot.capturedAt}, ${JSON.stringify(entry.snapshot)}::jsonb)
        ON CONFLICT (event_key, captured_at) DO NOTHING
      `;
    }
    await sql`
      DELETE FROM live_engine_history
      WHERE captured_at < NOW() - INTERVAL '2 days'
    `;
  } catch (error) {
    console.warn('[live-engine] persistent history save failed:', error);
  }
}
'''
          if 'async function ensurePersistence()' not in s:
              s = s.replace(marker, marker + block)

          old = '''function appendHistory(matches: LiveMatch[]) {
  const capturedAt = new Date().toISOString();
  for (const match of matches) {
    const key = eventKey(match);
    const history = state.history[key] ?? [];
    const snapshot = createSnapshot(match, capturedAt);
    if (snapshotChanged(history.at(-1), snapshot)) {
      state.history[key] = [...history, snapshot].slice(-HISTORY_LIMIT);
    }
  }
}'''
          new = '''async function appendHistory(matches: LiveMatch[]) {
  const capturedAt = new Date().toISOString();
  const keys = matches.map(eventKey);
  await loadPersistentHistory(keys);
  const pending: Array<{ key: string; snapshot: Snapshot }> = [];
  for (const match of matches) {
    const key = eventKey(match);
    const history = state.history[key] ?? [];
    const snapshot = createSnapshot(match, capturedAt);
    if (snapshotChanged(history[history.length - 1], snapshot)) {
      state.history[key] = [...history, snapshot].slice(-HISTORY_LIMIT);
      pending.push({ key, snapshot });
    }
  }
  await persistSnapshots(pending);
}'''
          if old in s:
              s = s.replace(old, new)
          s = s.replace('    appendHistory(matches);', '    await appendHistory(matches);')
          s = s.replace("mode: 'central-continuous',", "mode: process.env.DATABASE_URL ? 'central-persistent' : 'central-continuous',")
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/app/api/live/central/route.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: persist central live engine history in database"
          git push
