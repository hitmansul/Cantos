name: Run live selected fallback patch

on:
  push:
    paths:
      - '.github/workflows/run-live-selected-fallback-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/patch_live_selected_fallback.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/LiveCornerStats.tsx apps/web/src/app/api/live/corners-fast/route.ts
          git commit -m "fix: show loading for every selected live match"
          git push origin main