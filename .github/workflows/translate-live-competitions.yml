name: Translate live competitions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/translate-live-competitions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Translate competition labels in live history
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/web/src/app/live-history/page.tsx')
          s = p.read_text()
          marker = "const trendLabels: Record<TrendStatus, string> = {"
          if 'function translateCompetition(' not in s:
              insert = r'''
const competitionExactPt: Record<string, string> = {
  'Friendly': 'Amistoso',
  'Friendlies': 'Amistosos',
  'Club Friendly': 'Amistoso de Clubes',
  'Premier League': 'Premier League',
  'Champions League': 'Liga dos Campeões',
  'Europa League': 'Liga Europa',
  'Conference League': 'Liga Conferência',
  'World Cup': 'Copa do Mundo',
  'World Cup Qualification': 'Eliminatórias da Copa do Mundo',
  'Copa Libertadores': 'Copa Libertadores',
  'Copa Sudamericana': 'Copa Sul-Americana',
};

const competitionTermsPt: Array<[RegExp, string]> = [
  [/Regular Season/gi, 'Temporada Regular'],
  [/Regular Stage/gi, 'Fase Regular'],
  [/Group Stage/gi, 'Fase de Grupos'],
  [/Championship Round/gi, 'Fase do Campeonato'],
  [/Relegation Round/gi, 'Fase de Rebaixamento'],
  [/Promotion Round/gi, 'Fase de Acesso'],
  [/Qualifying Round/gi, 'Fase Eliminatória'],
  [/Qualification/gi, 'Eliminatórias'],
  [/Qualifiers/gi, 'Eliminatórias'],
  [/Quarter[- ]?finals?/gi, 'Quartas de final'],
  [/Semi[- ]?finals?/gi, 'Semifinais'],
  [/Round of 16/gi, 'Oitavas de final'],
  [/Round of 32/gi, '16-avos de final'],
  [/Finals?/gi, 'Final'],
  [/Play[- ]?offs?/gi, 'Playoffs'],
  [/Opening/gi, 'Abertura'],
  [/Closing/gi, 'Clausura'],
  [/Women/gi, 'Feminina'],
  [/Youth/gi, 'Juvenil'],
  [/Reserves?/gi, 'Reservas'],
  [/North/gi, 'Norte'],
  [/South/gi, 'Sul'],
  [/East/gi, 'Leste'],
  [/West/gi, 'Oeste'],
  [/Northeast/gi, 'Nordeste'],
  [/Northwest/gi, 'Noroeste'],
  [/Southeast/gi, 'Sudeste'],
  [/Southwest/gi, 'Sudoeste'],
  [/First Division/gi, '1ª Divisão'],
  [/Second Division/gi, '2ª Divisão'],
  [/Third Division/gi, '3ª Divisão'],
  [/Fourth Division/gi, '4ª Divisão'],
  [/1\. Division/gi, '1ª Divisão'],
  [/2\. Division/gi, '2ª Divisão'],
  [/3\. Division/gi, '3ª Divisão'],
  [/4\. Division/gi, '4ª Divisão'],
  [/Division 1/gi, '1ª Divisão'],
  [/Division 2/gi, '2ª Divisão'],
  [/Division 3/gi, '3ª Divisão'],
  [/Division 4/gi, '4ª Divisão'],
];

const countriesPt: Record<string, string> = {
  'Argentina':'Argentina','Australia':'Austrália','Austria':'Áustria','Belarus':'Bielorrússia','Belgium':'Bélgica',
  'Bolivia':'Bolívia','Bosnia and Herzegovina':'Bósnia e Herzegovina','Brazil':'Brasil','Bulgaria':'Bulgária','Canada':'Canadá',
  'Chile':'Chile','China':'China','Colombia':'Colômbia','Costa Rica':'Costa Rica','Croatia':'Croácia','Cyprus':'Chipre',
  'Czech Republic':'República Tcheca','Czechia':'República Tcheca','Denmark':'Dinamarca','Ecuador':'Equador','Egypt':'Egito',
  'England':'Inglaterra','Estonia':'Estônia','Finland':'Finlândia','France':'França','Georgia':'Geórgia','Germany':'Alemanha',
  'Greece':'Grécia','Hungary':'Hungria','Iceland':'Islândia','India':'Índia','Indonesia':'Indonésia','Ireland':'Irlanda',
  'Israel':'Israel','Italy':'Itália','Japan':'Japão','Kazakhstan':'Cazaquistão','Latvia':'Letônia','Lithuania':'Lituânia',
  'Mexico':'México','Netherlands':'Holanda','New Zealand':'Nova Zelândia','Northern Ireland':'Irlanda do Norte','Norway':'Noruega',
  'Paraguay':'Paraguai','Peru':'Peru','Poland':'Polônia','Portugal':'Portugal','Romania':'Romênia','Russia':'Rússia',
  'Saudi Arabia':'Arábia Saudita','Scotland':'Escócia','Serbia':'Sérvia','Slovakia':'Eslováquia','Slovenia':'Eslovênia',
  'South Africa':'África do Sul','South Korea':'Coreia do Sul','Spain':'Espanha','Sweden':'Suécia','Switzerland':'Suíça',
  'Turkey':'Turquia','Türkiye':'Turquia','Ukraine':'Ucrânia','United Arab Emirates':'Emirados Árabes Unidos','Uruguay':'Uruguai',
  'USA':'EUA','United States':'EUA','Venezuela':'Venezuela','Wales':'País de Gales'
};

function translateCompetition(value: string) {
  const original = value.trim();
  if (!original) return 'Competição';
  if (competitionExactPt[original]) return competitionExactPt[original];
  let result = original;
  for (const [english, portuguese] of Object.entries(countriesPt)) {
    result = result.replace(new RegExp(`\\(${english.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&')}\\)`, 'gi'), `(${portuguese})`);
  }
  for (const [pattern, replacement] of competitionTermsPt) result = result.replace(pattern, replacement);
  return result
    .replace(/\bLeague\b/gi, 'Liga')
    .replace(/\bCup\b/gi, 'Copa')
    .replace(/\bChampionship\b/gi, 'Campeonato')
    .replace(/\bNational\b/gi, 'Nacional')
    .replace(/\bRegional\b/gi, 'Regional')
    .replace(/\bSuper Cup\b/gi, 'Supercopa')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

'''
              s = s.replace(marker, insert + marker, 1)
          old = "competition: typeof item.competition === 'string' ? item.competition : 'Competição',"
          new = "competition: translateCompetition(typeof item.competition === 'string' ? item.competition : 'Competição'),"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit translation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/live-history/page.tsx
          git commit -m "feat: translate live competition names to Portuguese"
          git push
