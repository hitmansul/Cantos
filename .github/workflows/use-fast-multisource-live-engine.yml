name: Use fast multisource live engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/use-fast-multisource-live-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Point central engine to cached multi-source collector
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/app/api/live/central/route.ts')
          text = path.read_text(encoding='utf-8')
          old = "const url = new URL('/api/live/enriched', origin);"
          new = "const url = new URL('/api/live/corners-fast', origin);"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected central live source line not found')
          PY

      - name: Commit effective change
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/app/api/live/central/route.ts
          git commit -m 'feat: use cached multisource statistics in central live engine'
          git push origin main
